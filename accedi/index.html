<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>InScena – Accedi</title>
<style>
  body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#090d16;color:#e8ecf3;line-height:1.6;display:flex;min-height:100vh;align-items:center;justify-content:center}
  main{text-align:center;padding:20px}
  .logo{display:block;width:220px;max-width:70%;height:auto;margin:0 auto 16px}
  .muted{color:#99a6bf} a{color:#5b9cff}
</style>
</head>
<body>
<main>
  <img src="../logo.svg" alt="InScena" class="logo">
  <p class="muted">Apertura di InScena…</p>
  <p class="muted" style="font-size:.9rem">Se non si apre, <a id="link" href="https://audioops-web.vercel.app/">entra da qui</a>.</p>
</main>
<script>
  // Indirizzo definitivo della web app; finché non è attivo si usa quello di Vercel.
  var main = "https://app.inscenaapp.it/";
  var fallback = "https://audioops-web.vercel.app/";
  var done = false;
  function go(url) { if (done) return; done = true; document.getElementById("link").href = url; location.replace(url); }
  // In attesa del dominio su Neon Auth: si va su Vercel. Togliere la riga sotto quando app.inscenaapp.it accetta il login.
  go(fallback);
  var probe = new Image();
  probe.onload = function () { go(main); };
  probe.onerror = function () { go(fallback); };
  probe.src = main + "icon.png?v=" + Date.now();
  setTimeout(function () { go(fallback); }, 3000);
</script>
</body>
</html>
